<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>攤位圖規劃台 V43</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 展務工作檯，安靜、乾淨、好操作
   IDEA: 南港 1 館施工藍圖——以公尺為單位的全館平面，1F／4F 切換
   PICTURE: 平面圖本身佔滿畫面，周邊設施只用淡灰，攤位與黃金路口才有顏色
   COLOUR/TYPE: 白底深墨、TAITRA 藍；類別色沿用原攤位圖；Noto Sans TC
   LAYOUT: 一條工具列、中間圖面、右側生成器／屬性／統計／名單 */
:root{color-scheme:light;--bg:light-dark(#eef0f3,#121417);--panel:light-dark(#fff,#1d2024);--ink:light-dark(#1b1f24,#e8eaed);--mute:light-dark(#6b7280,#9aa1aa);--line:light-dark(#e3e6ea,#30343a);--acc:#0b5cad;--acc2:light-dark(#eaf2fb,#1a3350);--hot:#e8710a;--bad:#d93025;--ok:#188038}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
h1{font-size:16px;margin:0;white-space:nowrap;font-weight:700}
h1 small{font-size:11px;font-weight:500;color:var(--mute);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.btn:hover,.seg button:hover:not(.on){background:var(--acc2)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}
.btn.big{width:100%;min-height:46px;font-size:15px;font-weight:700}
.btn.ghost{border-color:transparent;background:none}
.btn.warn{color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.num{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:34px;text-align:center}
.mini{display:flex;gap:4px;align-items:center;color:var(--mute)}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:5;min-width:170px;display:grid}
.menu .dd button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;min-height:40px}
.menu .dd button:hover{background:var(--acc2)}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden}
#blankMsg{display:none}
.isoWrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.iso{width:100%;height:auto;border-radius:6px;display:block;background:#6b6b6b}
.iso polygon{cursor:pointer;stroke-linejoin:round}.isoOff{fill:rgba(40,40,40,.6);stroke:none}.isoOff:hover{fill:rgba(40,40,40,.35)}
.isoOn{fill:#fff;stroke:#fff;stroke-width:6;animation:isoBlink 1.1s ease-in-out infinite}
@keyframes isoBlink{0%,100%{fill-opacity:0;stroke-opacity:1}50%{fill-opacity:.45;stroke-opacity:.35}}
body.blank #blankMsg{display:flex;grid-column:1/-1;align-items:center;justify-content:center;background:#fff;text-align:center;padding:24px}
body.blank #blankMsg>div{max-width:520px}body.blank #blankMsg h2{font-size:22px;margin:0 0 10px}body.blank #blankMsg p{color:#555;line-height:1.7}
body.blank #stage,body.blank main>aside{display:none}
body.blank #wizBtn{animation:wzPulse 1.4s ease-in-out infinite;position:relative;z-index:2}
@keyframes wzPulse{0%,100%{box-shadow:0 0 0 0 rgba(11,92,173,.55);transform:scale(1)}50%{box-shadow:0 0 0 9px rgba(11,92,173,0);transform:scale(1.06)}}
#aisleBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:13px;white-space:nowrap}#aisleBar[hidden]{display:none}#aisleBar span{color:var(--mut,#666);margin:0 4px}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
#plan{cursor:grab}#plan.grabbing{cursor:grabbing}#plan.edit{cursor:crosshair}#plan.fill{cursor:crosshair}#plan.aisle{cursor:move}
.bth{cursor:pointer}#plan.edit .bth{cursor:move}
#toolBox{padding:10px 14px 4px;border-bottom:1px solid var(--line)}#toolBox .tb{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;margin-bottom:8px}#toolBox .h{margin:0;font-size:12px;color:var(--mute)}#toolBox .seg{flex-wrap:wrap}
svg.wallm{cursor:crosshair}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px 8px;border-bottom:1px solid var(--line);background:#f6f7f9}
.tabs button{flex:1;border:1px solid #d5d9e0;border-radius:8px;padding:8px 2px;cursor:pointer;min-height:40px;color:#3b4250;font-size:13px;background:#fff;border-top:4px solid var(--tc)}
.tabs button:hover{background:#f0f4fa}
.tabs button.on{background:var(--tc);color:#fff;font-weight:700;border-color:var(--tc)}
.tabs [data-tab=gen]{--tc:#0b5cad}.tabs [data-tab=cost]{--tc:#c2410c}.tabs [data-tab=prop]{--tc:#15803d}.tabs [data-tab=stat]{--tc:#7c3aed}.tabs [data-tab=ex]{--tc:#0e7490}
#pane{padding:16px;overflow:auto;flex:1}
.sec{margin-bottom:18px}
.sec>label.h,.h{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:34px;cursor:pointer;font-size:13.5px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.chip:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:1px}
.fld{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.fld label{color:var(--mute);font-size:13px}
.fld input,.fld select,.fld textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
.hint{color:var(--mute);font-size:12.5px;margin:6px 0}
.note{border-radius:8px;padding:9px 11px;font-size:13px;margin:10px 0;background:var(--acc2)}
.note.ok{background:light-dark(#e9f5ec,#173a22)}
.note.bad{background:light-dark(#fdecea,#3a1a18);color:light-dark(#a50e0e,#f6aea9)}
table.tier{border-collapse:collapse;width:100%;font-size:13px}
table.tier th{font-weight:400;color:var(--mute);text-align:left;padding:0 3px 4px;font-size:12px}
table.tier td{padding:2px 3px;border-top:1px solid var(--line)}
table.tier tr:first-child td{border-top:0}
table.tier input,table.tier select{width:100%;padding:4px 4px;border:1px solid transparent;border-radius:6px;background:transparent;min-height:34px;text-align:center}
table.tier input:hover,table.tier select:hover{border-color:var(--line)}
table.tier select{text-align:left}
table.tier select{padding-left:8px;font-size:12.5px}
select.sel{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:34px;flex:none}
.cats{display:grid;gap:6px;margin-top:8px}
.catr{display:grid;grid-template-columns:34px minmax(0,1fr) 104px 30px;gap:6px;align-items:center}
.catr input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.catr input[type=text]{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:34px}
.style{display:flex;gap:8px;align-items:center;justify-content:space-between;background:light-dark(#fff6ec,#3a2a17);border-radius:8px;padding:9px 11px;font-size:13px;margin:10px 0}
table.tier .u{white-space:nowrap;font-weight:700;padding-left:4px}
table.tier .x,.catr .x{border:0;background:none;color:var(--mute);cursor:pointer;min-width:30px;min-height:34px;border-radius:6px}
table.tier .x:hover,.catr .x:hover{color:var(--bad);background:var(--acc2)}
.sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin:6px 2px}
details.rules{font-size:13px;color:var(--mute);margin-top:6px}
details.rules summary{cursor:pointer;padding:6px 0}
details.rules ol{margin:4px 0 0;padding-left:20px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--mute);font-size:12px}
.catrow{margin:8px 0}
.catrow .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.sw{display:inline-block;width:11px;height:11px;border:1px solid #999;border-radius:2px;vertical-align:-1px;margin-right:6px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.list li:hover{background:var(--acc2)}
.list li.on{background:var(--acc2);outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px}
.list li .r{color:var(--mute);white-space:nowrap}
.list li.done .r{color:var(--ok)}
.list li.bad .r{color:var(--bad)}
footer{background:var(--panel);border-top:1px solid var(--line);padding:4px 14px;font-size:12px;color:var(--mute);display:flex;gap:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
.box{background:var(--panel);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.box h2{font-size:18px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.box h3{font-size:14px;margin:18px 0 6px}
.box table{border-collapse:collapse;width:100%}
.box td{padding:3px 4px}
.box td input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g4 label{font-size:12px;color:var(--mute);display:block}
.g4 input,.g4 select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
textarea.code{width:100%;min-height:90px;font:12px/1.45 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)}
#pngOut img{max-width:100%;border:1px solid var(--line);margin-top:8px}
@media(max-width:900px){body{overflow:auto;height:auto}main{grid-template-columns:1fr}#stage{height:70vh}aside{border-left:0;border-top:1px solid var(--line)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.spacer{display:none}}
</style>
</head>
<body>
<header>
  <h1>攤位圖規劃台<small>V43</small></h1>
  <div class="seg" role="group" aria-label="存檔"><button data-slot="1" title="存檔 1">存檔1</button><button data-slot="2" title="存檔 2">存檔2</button><button data-slot="3" title="存檔 3">存檔3</button></div>
  <button class="btn pri" id="wizBtn" title="先算天數、區域與費用，再開始排攤位">＋ 開新展覽</button>
  <div class="seg" role="group" aria-label="樓層"><button data-floor="1F" title="1F 一樓展場">1F</button><button data-floor="4F" title="4F 雲端展場">4F</button></div>
  <div class="seg" role="group" aria-label="模式">
    <button data-mode="select" class="on" title="左鍵拖曳＝移動畫面；Alt＋左鍵＝操作攤位">一般</button>
    <button data-mode="fill" title="框選一塊區域，自動排滿（F）">框選排滿</button>
    <button data-mode="aisle" title="直接拖曳主走道與隔牆黑線（A）">調走道</button>
    <button data-mode="wall" title="像筆一樣畫隔板：拖曳畫一段，或一點一點連續點（W）；Esc 結束">畫隔板</button>
  </div>
  <div class="mini"><input class="num" id="szW" type="number" step="0.5" min="0.5" value="3" aria-label="寬（m）">×<input class="num" id="szD" type="number" step="0.5" min="0.5" value="3" aria-label="深（m）"><button class="btn" id="addOne" title="在畫面中央放一個這個尺寸的攤位">＋攤位</button></div>
  <div class="spacer"></div>
  <div class="mini">
    <button class="btn ghost" id="undo" title="回到上一步（Ctrl+Z）">↶</button>
    <button class="btn ghost" id="redo" title="下一步（Ctrl+Y）">↷</button>
    <button class="btn ghost warn" id="wipe" title="把這層樓的攤位全部清掉，留下空場地">清空</button>
    <div class="seg" role="group" aria-label="縮放"><button id="zOut" title="縮小">－</button><button id="fitHall" title="整個展場置中">置中</button><button id="zIn" title="放大">＋</button></div>
    <button class="btn" id="magBtn" title="拖攤位靠近其他攤位時自動貼齊；拖曳時按住 Shift 可暫時不吸">磁吸</button>
    <button class="btn" id="stageBtn" title="新增舞台區，自訂尺寸">＋舞台</button><button class="btn" id="wallBtn" title="在畫面中央加一條隔板（黑線），Alt＋拖曳移動、Z 轉向、Del 刪除">＋隔板</button>
    <button class="btn" id="dashBtn" title="顯示 3m×3m 虛線格線，看每攤幾格">虛線格</button>
    <button class="btn pri" id="impBtn" title="匯入報名 Excel：抓公司名稱、攤位數、展區">匯入名單</button><button class="btn" id="pdfBtn" title="匯入現有的攤位圖 PDF（館方 iMap 輸出的 1F／4F 圖），系統換算成可編輯的攤位，再接著算錢">匯入現有攤位圖</button>
    <details class="menu"><summary class="btn">更多</summary><div class="dd"><button id="numBtn">自動編號</button><button id="expBtn">匯出／匯入</button><button id="setBtn">設定</button></div></details>
  </div>
</header>
<main>
  <div id="blankMsg"><div><h2>還沒有展覽</h2><p>按左上角 <b>「＋ 開新展覽」</b>，依序填檔期、看費用、上傳廠商總表，系統會自動選區並排好攤位。</p>
    <div class="row" style="justify-content:center"><button class="btn pri big" id="blankGo">＋ 開新展覽</button></div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="blankPdf">已有攤位圖？匯入 PDF</button></div><p class="hint" style="margin-top:18px">已經有存檔？按左上「存檔1／2／3」讀取。<a href="#" id="blankSkip">或直接開空白平面圖</a></p></div></div>
  <div id="stage"><div id="aisleBar" hidden><span>拖曳灰色主走道、黑色隔牆移動；點一下隔牆可刪除</span><button class="btn ghost" id="aoReset">走道回正對大門</button><button class="btn ghost" id="limReset">隔牆回區界</button><button class="btn ghost" id="limAdd">加上下隔牆</button><button class="btn pri" id="aoDone">完成</button></div><svg id="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside>
    <div class="tabs"><button data-tab="gen" class="on">生成器</button><button data-tab="cost">費用試算</button><button data-tab="prop">編輯工具</button><button data-tab="stat">統計</button><button data-tab="ex">廠商名單</button></div>
    <div id="toolBox" hidden>
      <div class="tb"><span class="h">操作模式</span><div id="tbMode"></div></div>
      <div class="tb"><span class="h">新增</span><div id="tbAdd" class="row" style="margin:0;gap:6px;flex-wrap:wrap"></div></div>
      <div class="tb"><span class="h">畫面</span><div id="tbView"></div></div>
    </div>
    <div id="pane"></div>
  </aside>
</main>
<footer><span id="pos">X — Y —</span><span id="selInfo">未選取</span><span>左鍵拖曳＝移動畫面・<b>Alt＋左鍵</b>＝拖拉攤位・Alt＋拖空白＝框選・Alt＋Shift＝多選・單擊＝看屬性・滾輪縮放・Del 刪除・<b>Z 轉方向</b>・L 鎖定</span></footer>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileXls" accept=".xlsx,.xls,.csv" hidden><input type="file" id="filePdf" accept=".pdf" multiple hidden>

      <li style="cursor:default;color:#6b7280"><span>參考：場地費小計（未稅，未依使用比例折算）</span><span>${$$n(R2)}</span></li>
      <li style="cursor:default;color:#6b7280"><span>參考：若全部攤位都用滿（上限，含稅）</span><span>${$$n(Math.round(R2*1.05))}</span></li></ul>
    <div class="row" style="justify-content:space-between;margin-top:14px">${back?'<button class="btn ghost" id="st_back">上一步</button>':'<span></span>'}<span><button class="btn" id="st_cal">改需求（週曆）</button> <button class="btn pri" id="st_print">列印／存成 PDF</button></span></div>`);
  ['io','sh'].forEach(k=>$('#st_'+k).onchange=e=>{const v=e.target.value.replace(/\s/g,'').replace(/[～~–—]/g,'-');if(!/^\d\d:\d\d-\d\d:\d\d$/.test(v))return toast('格式例：09:30-17:30');c.times={...T,[k]:v};save();settleSheet(back)});
  $('#st_cal').onclick=()=>costCal();$('#st_back')&&($('#st_back').onclick=back);
  $('#st_print').onclick=()=>{const info=c.info||{},fl=[...new Set(A.map(fOf))].map(f=>f[0]).join('、');
    modal('列印結算單',`<div class="fld" style="grid-template-columns:90px minmax(0,1fr)"><label for="pi_n">活動名稱</label><input id="pi_n" value="${esc(info.name||'')}" placeholder="例：2026 Taipei PLAS">
      </div>
      <label class="chk"><input type="checkbox" id="pi_est" checked>尾款、VAT、總額旁標註「粗估」</label>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ghost" id="pi_back">上一步</button><button class="btn pri" id="pi_go">產生列印版</button></div>`);
    $('#pi_back').onclick=()=>settleSheet(back);
    $('#pi_go').onclick=()=>{c.info={...info,name:$('#pi_n').value.trim()};save();const est=$('#pi_est').checked?'（粗估）':'';
      const first=add(cd[0].d,-Math.max(0,...r.rows.map(o=>o.inX))),last=cd[cd.length-1].d,days=Math.round((last-first)/864e5)+1,tot=r.rows.reduce((t,o)=>t+o.off,0);
      const n=v=>Math.round(v).toLocaleString('en-US'),SH=r.rows.map((o,i)=>{const R=o.R||[],grp={};R.forEach(x=>grp[x.k]=(grp[x.k]||0)+1);const seen={};
        return `<div class="blk"><div class="cap">(${String.fromCharCode(65+i)}) ${o.a}區 共計${o.off}個攤位</div><table>
        <tr><th style="width:15%">項目</th><th style="width:25%">日期</th><th style="width:16%">每日使用時間</th><th style="width:16%">單價</th><th colspan="2" style="width:8%">單位</th><th colspan="2" style="width:20%">金額</th></tr>
        ${R.map(x=>{const f=!seen[x.k];seen[x.k]=1;return `<tr>${f?`<td rowspan="${grp[x.k]}">${x.k}</td>`:''}<td class="c">${x.d}</td><td class="c">${x.t.replace('-',' - ')}</td><td class="r">$${n(x.u)}</td><td class="c n">${x.n}</td><td class="c n">${x.un}</td><td class="d">$</td><td class="r">${n(x.v)}</td></tr>`}).join('')}
        <tr><td colspan="6" class="r">小計--場地費 (未稅)</td><td class="d">$</td><td class="r">${n(o.sub)}</td></tr>
        <tr><td colspan="6" class="r">訂金=場地費之20%</td><td class="d">$</td><td class="r">${n(o.dep)}</td></tr>
        <tr><td colspan="6" class="r">尾款=實際使用攤位數 <u>${o.used}</u> 之80%${est}</td><td class="d">$</td><td class="r">${n(o.tail)}</td></tr>
        <tr><td colspan="6" class="r">5%VAT${est}</td><td class="d">$</td><td class="r">${n(o.vat)}</td></tr>
        <tr class="g"><td colspan="6" class="r">總場地費 (含稅)${est}</td><td class="d">$</td><td class="r">${n(o.tot)}</td></tr></table><div class="tag">(${i+1})</div></div>`});
      const pages=[];for(let i=0;i<SH.length;i+=2)pages.push(SH.slice(i,i+2).join(''));
      const head=`<table class="meta"><tr><td>活動名稱</td><td>${esc(c.info.name||'')}</td><td>場地開始租用日期</td><td class="r">${first.getFullYear()}/${first.getMonth()+1}/${first.getDate()}</td></tr>
        <tr><td>區域</td><td class="b">${fl}樓展場</td><td>場地結束租用日期</td><td class="r">${last.getFullYear()}/${last.getMonth()+1}/${last.getDate()}</td></tr>
        <tr><td>承租面積</td><td class="b">共計${n(tot)}個攤位</td><td>總使用天數</td><td class="r"><b>${days}</b> 天</td></tr>
</table>`;
      const foot=`<div class="sum">總場地費合計=${r.rows.map((o,i)=>`(${i+1})`).join('+')}${est}　$　<b>${n(r.rent+r.tax)}</b></div>
        <div class="note">1.進場期間每日04時至07時為免費進場時段。<br>2.出場第二天以「小時」計費，提供07時至08時免費出場。</div>`;
      const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>場地租用結算單 ${esc(c.info.name||'')}</title><style>
        @page{size:A4;margin:14mm 14mm}body{font-family:"PMingLiU","MingLiU","Noto Serif TC","Times New Roman",serif;color:#000;margin:0;font-size:12.5px}
        .page{page-break-after:always}.page:last-child{page-break-after:auto}
        .org{text-align:center;font-size:15px;line-height:1.5}.org small{font-size:12px}
        .ttl{text-align:center;font-size:20px;font-weight:700;border-top:3px double #000;border-bottom:1px solid #000;margin:4px 0 6px;padding:3px 0}.ttl small{font-size:12px;font-weight:400}
        .meta{width:100%;border-collapse:collapse;margin-bottom:26px;border-top:3px double #000;border-bottom:1px solid #000}.meta td{padding:2px 6px}.meta .b{color:#0b3ea8;font-weight:700}
        .blk{position:relative;margin:22px 0 10px}.cap{font-size:13px;margin-bottom:2px}
        table.t,.blk table{width:100%;border-collapse:collapse;border:2px solid #000}.blk th,.blk td{border:1px solid #000;padding:2px 5px;font-weight:400}
        .blk th{text-align:center}.c{text-align:center}.r{text-align:right}.d{border-right:0!important;width:14px}.d+td{border-left:0!important}.n{width:22px}
        .g td{background:#e5e5e5}.tag{position:absolute;right:-26px;bottom:2px}
        .sum{text-align:right;font-size:14px;color:#0b3ea8;margin:20px 0 8px}.note{color:#c00;font-size:13px;line-height:1.7}
        </style></head><body>${pages.map((p,i)=>`<div class="page">${i===0?head:''}${p}${i===pages.length-1?foot:''}</div>`).join('')}</body></html>`;
      closeM();
      const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
      fr.srcdoc=html;fr.onload=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.print()}else toast('瀏覽器擋住列印，請允許彈出視窗')}setTimeout(()=>fr.remove(),60000)};
      PRINT_HTML=html}}}
function wizSummary(){WZ.flow=false;const A=['I','J','K','L','M','N'].filter(a=>S.areas[a]),r=costOf(A),g=lastGen||{n:0,u:0,e:0,eu:0,fail:[]};
  modal('開新展覽：完成',`<div class="note ok">已排 <b>${g.n}</b> 家・${g.u} 攤${g.e?`；空攤 ${g.e} 個`:''}${g.fail.length?`；<b style="color:var(--bad)">放不下 ${g.fail.length} 家</b>`:''}</div>
    ${g.pinWarn&&g.pinWarn.length?`<div class="note">${g.pinWarn.map(esc).join('<br>')}</div>`:''}
    <ul class="list"><li style="cursor:default"><span>開區</span><span><b>${esc(cfgName(A))}</b></span></li>
    <li style="cursor:default"><span>檔期</span><span>${esc(S.cost.start||'')}・進場 ${S.cost.inD}＋展出 ${S.cost.showD}＋退場 ${S.cost.outD} 天</span></li>
    <li style="cursor:default;font-size:16px;background:#fff5f5"><span><b>總場地費（含稅）＝訂金＋尾款＋VAT</b></span><span><b>${$$n(r.rent+r.tax)}</b></span></li>
    <li style="cursor:default"><span>　訂金 20%</span><span>${$$n(r.rows.reduce((t,o)=>t+o.dep,0))}</span></li>
    <li style="cursor:default;color:#6b7280"><span>　尾款 80%×使用比例（粗估，依隔板範圍）</span><span>${$$n(r.rows.reduce((t,o)=>t+o.tail,0))}</span></li>
    <li style="cursor:default;color:#6b7280"><span>　5%VAT（粗估）</span><span>${$$n(r.tax)}</span></li>
    <li style="cursor:default;color:#6b7280"><span>參考：場地費小計（未稅）</span><span>${$$n(r.gross)}</span></li>
    <li style="cursor:default;color:#6b7280"><span>清潔費（含稅）</span><span>${$$n(r.clean)}</span></li></ul>
    <div class="row" style="justify-content:space-between;margin-top:14px"><span><button class="btn pri" id="ws_st">看各區結算單（粗估）</button> <button class="btn" id="ws_cal">看週曆</button></span><button class="btn" id="ws_ok">開始調整平面圖</button></div>`);
  $('#ws_st').onclick=()=>settleSheet(wizSummary);$('#ws_cal').onclick=()=>costCal();$('#ws_ok').onclick=()=>{closeM();fitHall()}}
$('#wizBtn').onclick=()=>{WZ.A=null;WZ.U=0;WZ.N=0;wizard()};
$('#impBtn').onclick=()=>$('#fileXls').click();
$('#pdfBtn').onclick=()=>$('#filePdf').click();$('#blankPdf').onclick=()=>$('#filePdf').click();
$('#filePdf').onchange=e=>{const fs=[...e.target.files];e.target.value='';importPlanPdf(fs)};
$('#fileXls').onchange=e=>{const f=e.target.files[0];if(f)importXls(f);e.target.value=''};
$('#wipe').onclick=()=>{const keep=B().filter(b=>b.locked);if(B().length===keep.length)return toast('已經是空的');push();S.plans[S.floor]=keep;sel.clear();lastGen=null;commit();toast(`${S.floor} 已清空${keep.length?`（保留 ${keep.length} 個鎖定攤位）`:''}，按「↶ 上一步」可救回`)};
$('#setBtn').onclick=settings;$('#numBtn').onclick=numDialog;$('#expBtn').onclick=exportDialog;
document.addEventListener('pointerdown',e=>{const m=$('.menu');if(m.open&&!m.contains(e.target))m.open=false});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeM();return}
  if(mode==='wall'&&e.key==='Escape'){if(WD.a){WD.a=null;wdPrev()}else setMode('select');return}
  const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==='Alt'){e.preventDefault();svg.classList.add('edit');return}
  if(k===' '){space=true;e.preventDefault();return}
  if(c&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(c&&k==='y'){e.preventDefault();redo()}
  else if(c&&k==='d'){e.preventDefault();dup()}
  else if(c&&k==='a'){e.preventDefault();sel=new Set(B().map(b=>b.id));render();renderPane()}
  else if(c&&k==='c'){clip=[...sel].map(byId).filter(Boolean).map(b=>({...b}))}
  else if(c&&k==='v'&&clip.length){push();const ids=clip.map(b=>{const n={...b,id:uid(),no:'',y:rd(b.y+b.d)};B().push(n);return n.id});sel=new Set(ids);commit()}
  else if(k==='delete'||k==='backspace'){e.preventDefault();del()}
  else if(k==='r'||k==='z')rotate();
  else if(k==='l')toggleLock();
  else if(k==='f')setMode(mode==='fill'?'select':'fill');
  else if(k==='a')setMode(mode==='aisle'?'select':'aisle');
  else if(k==='w')setMode(mode==='wall'?'select':'wall');
  else if(k==='escape'){sel.clear();render();renderPane()}
  else if(k.startsWith('arrow')){e.preventDefault();const s=e.shiftKey?3:S.snap;nudge(k==='arrowleft'?-s:k==='arrowright'?s:0,k==='arrowup'?-s:k==='arrowdown'?s:0)}
});
document.addEventListener('keyup',e=>{if(e.key===' ')space=false;if(e.key==='Alt'){e.preventDefault();svg.classList.remove('edit')}});
window.addEventListener('blur',()=>svg.classList.remove('edit'));

setFloor(S.floor);
const SAMPLE=['台中精機','百智','富強鑫','德霆'];
if(!firstRun&&S.ex.length&&S.ex.every(x=>SAMPLE.includes(x.name))){S.ex=[];Object.values(S.plans).flat().forEach(b=>{if(SAMPLE.includes(b.name)){b.name='';b.tag=`${rd(units(b))}攤`}});save()}
if(S.started===undefined)S.started=!firstRun&&(Object.values(S.plans).flat().length>0||S.ex.length>0);
const syncBlank=()=>{document.body.classList.toggle('blank',!S.started);if(S.started&&!syncBlank.done){syncBlank.done=1;requestAnimationFrame(()=>{fitHall()})}};syncBlank();
$('#blankGo').onclick=()=>wizard();$('#blankSkip').onclick=e=>{e.preventDefault();S.started=true;save();syncBlank();commit()};
renderPane();render();
}
